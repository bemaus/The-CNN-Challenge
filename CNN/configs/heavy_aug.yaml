seed: 0

data:
  train_root: ../data/train
  test_root: ../data/test
  test2_root: ../data/test2
  img_size: 224
  batch_size: 32
  val_fraction: 0.20
  num_workers: 0
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  augment:
    random_resized_crop_scale: [0.0, 0.0]
    horizontal_flip: false
    rotation_degrees: 00
    color_jitter: [0.0, 0.0, 0.0]
    random_grayscale_p: 0.0
    random_erasing_p: 0.0
    cutmix_alpha: 0.0
    cutmix_prob: 0.0

model:
  name: efficientnet_b0
  dropout: 0.3
  pretrained: true

optimizer:
  backbone_lr: 3.0e-3
  head_lr: 3.0e-3
  weight_decay: 1.0e-3

scheduler:
  warmup_epochs: 1

training:
  num_epochs: 20
  label_smoothing: 0.0
  patience: 6

output:
  checkpoint: ../Models/efficientnet_b0_heavy.pt