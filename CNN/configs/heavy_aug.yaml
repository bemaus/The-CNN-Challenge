seed: 0

data:
  train_root: ../data/train
  test_root: ../data/test
  test2_root: ../data/test2
  img_size: 224
  batch_size: 32
  val_fraction: 0.20
  num_workers: 0
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augment:
    random_resized_crop_scale: [1.0 , 1.4]
    horizontal_flip: true
    rotation_degrees: 30
    color_jitter: [0.6, 0.6, 0.5]
    random_grayscale_p: 0.5
    random_erasing_p: 0.0
    cutmix_alpha: 0.7
    cutmix_prob: 0.7

model:
  name: efficientnet_b0
  dropout: 0.3
  pretrained: true

optimizer:
  backbone_lr: 3.0e-4
  head_lr: 3.0e-3
  weight_decay: 1.0e-4

scheduler:
  warmup_epochs: 1

training:
  num_epochs: 30
  label_smoothing: 0.0
  patience: 6

output:
  checkpoint: ../Models/efficientnet_b0_heavy.pt